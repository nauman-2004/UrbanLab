[project]
name = "urbanlab-backend"
version = "0.1.0"
description = "UrbanLab agent backend: DeepAgents orchestrator + FastAPI/SSE"
requires-python = ">=3.11,<3.12"
dependencies = [
    "deepagents==0.7.38",
    "langchain==1.5.0",
    "langgraph==1.2.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "scipy>=1.13",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "langchain-google-genai>=4.5.0",
    "urbanlab-costar",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.sources]
urbanlab-costar = { path = "../costar", editable = true }
